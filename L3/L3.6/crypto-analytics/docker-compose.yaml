version: '3.8'

services:
  db:
    image: postgres:18
    container_name: crypto-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: crypto
    ports:
      - "5432:5432"
    volumes:
      - ./dump.sql:/docker-entrypoint-initdb.d/dump.sql

  app:
    build: .
    container_name: crypto-app
    ports:
      - "8080:8080"
    depends_on:
      - db
